<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="index 03 interacción con el usuario">
    <title>Interacción con el usuario</title>
</head>

<body>
    <input id="myId" type="text">
    <button onclick="console.log(document.getElementById('myId').value)">Ir al texto</button><!--el mensaje aparece en la consola-->
    <!--------------------------------------------------------------------------------------------->
    <script>
        alert("Hello, World!")
        window.alert("Hello, World! for the second time");
        alert(4 * 7);
        alert(true);
        alert("text 1", "text 2"); // only "text 1" will be displayed
    </script>


</body>

</html>
